# Company careers collected through the shared ATS board adapter (ats_board).
# New Greenhouse / Lever / Ashby / Workday companies: add a row. Do not add
# collector code.
#
# Required: id, company, market (cn | en | global)
# Board identity: ats + slug, or careers_url on a known host
#   greenhouse: https://boards.greenhouse.io/{slug} or job-boards.greenhouse.io/{slug}
#   lever:      https://jobs.lever.co/{slug}
#   ashby:      https://jobs.ashbyhq.com/{slug}
#   workday:    https://{tenant}.wd{N}.myworkdayjobs.com/{site}
#               slug is {host}/{site} (site is case-sensitive)
#
# Taleo / Oracle Recruiting Cloud: not runnable. No public job-board API.
# iCIMS: not runnable. Partner API + HTML career portals only.

companies:
  - id: dimagi
    company: Dimagi
    ats: greenhouse
    slug: dimagi
    careers_url: https://job-boards.greenhouse.io/dimagi
    market: global
    notes: Greenhouse public board API

  - id: automattic
    company: Automattic
    ats: greenhouse
    slug: automatticcareers
    careers_url: https://automattic.com/work-with-us/
    market: global
    notes: Greenhouse board token is automatticcareers

  - id: palantir
    company: Palantir
    ats: lever
    slug: palantir
    careers_url: https://jobs.lever.co/palantir
    market: global
    notes: Lever public postings JSON

  - id: redhat
    company: Red Hat
    ats: workday
    slug: redhat.wd5.myworkdayjobs.com/Jobs
    careers_url: https://redhat.wd5.myworkdayjobs.com/Jobs
    market: global
    notes: Workday CXS JSON (undocumented, unauthenticated)
